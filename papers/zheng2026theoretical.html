    <style>
        body { max-width: 70rem; margin: 2rem auto; padding: 0 1rem; font-family: sans-serif; line-height: 1.5; }
        textarea { box-sizing: border-box; width: 100%; min-height: 22rem; padding: 1rem; font: 1rem/1.5 monospace; }
        button, a { margin-right: 1rem; }
    </style>
</head>
<body>
    <h1>Theoretical Investigation on Inductive Bias of Isolation Forest</h1>
    <label for="bibtex">BibTeX citation</label>
    <textarea id="bibtex" readonly spellcheck="false">@inproceedings{zheng2026theoretical,
  title = {Theoretical Investigation on Inductive Bias of Isolation Forest},
  author = {Zheng, Qin-Cheng and Zhang, Shao-Qun and Lyu, Shen-Huan and Jiang, Yuan and Zhou, Zhi-Hua},
  booktitle = {Proceedings of the 43rd International Conference on Machine Learning},
  year = {2026},
  volume = {306},
  series = {Proceedings of Machine Learning Research},
  pages = {163944--163972},
  publisher = {PMLR},
  url = {https://proceedings.mlr.press/v306/zheng26ag.html}
}
</textarea>
    <p>
        <button type="button" onclick="copyText()">Copy BibTeX</button>
        <a href="zheng2026theoretical.bib" download>Download .bib</a>
        <a href="https://proceedings.mlr.press/v306/zheng26ag.html">Publisher</a>
    </p>
    <p id="copy-status" role="status" aria-live="polite"></p>
    <script>
        async function copyText() {
            const field = document.getElementById('bibtex');
            const status = document.getElementById('copy-status');
            try {
                await navigator.clipboard.writeText(field.value);
                status.textContent = 'BibTeX copied.';
            } catch (error) {
                field.focus();
                field.select();
                field.setSelectionRange(0, field.value.length);
                status.textContent = 'Please copy the selected text, or download the .bib file.';
            }
        }
    </script>
</body>
