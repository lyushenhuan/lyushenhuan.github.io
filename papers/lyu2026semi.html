<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A semi-supervised deep forest framework based on margin distribution optimization for tabular data — BibTeX</title>
    <style>
        body { max-width: 70rem; margin: 2rem auto; padding: 0 1rem; font-family: sans-serif; line-height: 1.5; }
        textarea { box-sizing: border-box; width: 100%; min-height: 22rem; padding: 1rem; font: 1rem/1.5 monospace; }
        button, a { margin-right: 1rem; }
    </style>
</head>
<body>
    <h1>A semi-supervised deep forest framework based on margin distribution optimization for tabular data</h1>
    <label for="bibtex">BibTeX citation</label>
    <textarea id="bibtex" readonly spellcheck="false">@article{lyu2026semi,
  title = {A semi-supervised deep forest framework based on margin distribution optimization for tabular data},
  author = {Lyu, Shen-Huan and Xu, Jia-Le and He, Yi-Xiao and Wang, Yanyan and Ye, Baoliu and Zhang, Qingfu},
  journal = {Information Sciences},
  year = {2026},
  volume = {753},
  pages = {123615},
  doi = {10.1016/j.ins.2026.123615},
  url = {https://doi.org/10.1016/j.ins.2026.123615}
}
</textarea>
    <p>
        <button type="button" onclick="copyText()">Copy BibTeX</button>
        <a href="lyu2026semi.bib" download>Download .bib</a>
        <a href="https://doi.org/10.1016/j.ins.2026.123615">Publisher</a>
    </p>
    <p id="copy-status" role="status" aria-live="polite"></p>
    <script>
        async function copyText() {
            const field = document.getElementById('bibtex');
            const status = document.getElementById('copy-status');
            try {
                await navigator.clipboard.writeText(field.value);
                status.textContent = 'BibTeX copied.';
            } catch (error) {
                field.focus();
                field.select();
                field.setSelectionRange(0, field.value.length);
                status.textContent = 'Please copy the selected text, or download the .bib file.';
            }
        }
    </script>
</body>
</html>
