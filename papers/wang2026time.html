<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Time-Efficient Identifying Key Tag Distribution in Large-Scale RFID Systems — BibTeX</title>
    <style>
        body { max-width: 70rem; margin: 2rem auto; padding: 0 1rem; font-family: sans-serif; line-height: 1.5; }
        textarea { box-sizing: border-box; width: 100%; min-height: 22rem; padding: 1rem; font: 1rem/1.5 monospace; }
        button, a { margin-right: 1rem; }
    </style>
</head>
<body>
    <h1>Time-Efficient Identifying Key Tag Distribution in Large-Scale RFID Systems</h1>
    <label for="bibtex">BibTeX citation</label>
    <textarea id="bibtex" readonly spellcheck="false">@article{wang2026time,
  title = {Time-Efficient Identifying Key Tag Distribution in Large-Scale RFID Systems},
  author = {Wang, Yanyan and Liu, Jia and Qu, Zhihao and Lyu, Shen-Huan and Tang, Bin and Ye, Baoliu},
  journal = {IEEE Transactions on Mobile Computing},
  year = {2026},
  volume = {25},
  number = {2},
  pages = {2725--2742},
  doi = {10.1109/tmc.2025.3609967},
  url = {https://doi.org/10.1109/tmc.2025.3609967}
}
</textarea>
    <p>
        <button type="button" onclick="copyText()">Copy BibTeX</button>
        <a href="wang2026time.bib" download>Download .bib</a>
        <a href="https://doi.org/10.1109/tmc.2025.3609967">Publisher</a>
    </p>
    <p id="copy-status" role="status" aria-live="polite"></p>
    <script>
        async function copyText() {
            const field = document.getElementById('bibtex');
            const status = document.getElementById('copy-status');
            try {
                await navigator.clipboard.writeText(field.value);
                status.textContent = 'BibTeX copied.';
            } catch (error) {
                field.focus();
                field.select();
                field.setSelectionRange(0, field.value.length);
                status.textContent = 'Please copy the selected text, or download the .bib file.';
            }
        }
    </script>
</body>
